<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>番剧管理面板（修复布局版）</title>
<style>
*{box-sizing:border-box;font-family:system-ui}
body{background:#181818;color:#fff;padding:24px;max-width:1000px;margin:0 auto}
h1{margin-bottom:20px;color:#f7b500}
.form-item{margin-bottom:14px}
label{display:block;margin-bottom:6px;color:#ddd}
input,select,textarea{padding:10px;border-radius:6px;border:none;background:#292929;color:#fff;font-size:14px}
input{flex:1;}
textarea{min-height:220px;font-family:monospace;width:100%;}
.btns{display:flex;gap:12px;margin-top:16px;flex-wrap:wrap}
button{padding:10px 18px;border:none;border-radius:6px;cursor:pointer;font-weight:bold}
#addBtn{background:#28a745;color:#fff}
#copyBtn{background:#007bff;color:#fff}
#clearBtn{background:#dc3545;color:#fff}
#importBtn{background:#9400d3;color:#fff}
.preview{margin-top:12px;width:160px;border-radius:8px;aspect-ratio:3/4;background:#222;background-size:cover;background-position:center}
.list-item{background:#252525;padding:12px;border-radius:8px;margin-top:8px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.list-info{flex:1}
.list-title{font-weight:bold}
.list-ctrl{display:flex;gap:6px}
.ctrl-btn{padding:4px 8px;font-size:12px}
.up{background:#338833}
.down{background:#3388bb}
.del{background:#bb3333}
.ep-area{background:#222;padding:14px;border-radius:8px;margin:10px 0}
.ep-block{background:#2a2a2a;padding:10px;border-radius:8px;margin-bottom:10px}
/* =========修复线路行布局========= */
.line-line{
  display:flex;
  gap:8px;
  margin-top:8px;
  align-items:center;
}
.line-line select{
  width:110px;
  flex:none;
}
.del-line{background:#bb3333;border:none;color:#fff;border-radius:4px;padding:4px;cursor:pointer;flex:none}
.del-ep{background:#bb3333;border:none;color:#fff;border-radius:4px;padding:4px;cursor:pointer;margin-top:6px}
</style>
</head>
<body>
<h1>📺 番剧数据管理（多线路版）</h1>

<div class="form-item">
  <label>番剧标题</label>
  <input id="title" placeholder="例：转生成为魔剑 第二季">
</div>
<div class="form-item">
  <label>封面图链接 cover</label>
  <input id="cover" placeholder="https://xxx/cover.jpg" oninput="previewCover()">
  <div class="preview" id="coverPreview"></div>
</div>
<div class="form-item">
  <label>悬浮预览缩略图 previewThumb（可选，鼠标悬浮卡片弹出）</label>
  <input id="previewThumb" placeholder="https://xxx/preview.jpg">
</div>
<div class="form-item">
  <label>评分/标签 tag（右上角）</label>
  <input id="tag" placeholder="7.6">
</div>
<div class="form-item">
  <label>更新信息 meta</label>
  <input id="meta" placeholder="更新至8/8">
</div>
<div class="form-item">
  <label>年份 year</label>
  <input id="year" placeholder="2026">
</div>

<div class="ep-area">
  <label>剧集列表（每一集可添加多条线路，线路框内填写视频链接）</label>
  <div id="epContainer"></div>
  <button type="button" onclick="addEpBlock()" style="margin-top:8px;background:#28a745;border:none;padding:6px 10px;border-radius:4px;color:#fff">+ 添加一集</button>
</div>

<div class="btns">
  <button id="addBtn">➕ 添加到列表</button>
  <button id="importBtn">📥 导入现有JSON</button>
  <button id="copyBtn">📋 复制全部JSON</button>
  <button id="clearBtn">🗑️ 清空全部</button>
</div>

<div class="form-item" style="margin-top:20px;">
  <label>当前番剧列表（可上下调整顺序）</label>
  <div id="itemList"></div>
</div>

<div class="form-item" style="margin-top:20px;">
  <label>JSON预览（复制全部替换你的data.json内容）</label>
  <textarea id="jsonOut"></textarea>
</div>

<script>
let dataList = [];
let epBlockIndex = 0;
const dom = {
  title:document.getElementById('title'),
  cover:document.getElementById('cover'),
  previewThumb:document.getElementById('previewThumb'),
  tag:document.getElementById('tag'),
  meta:document.getElementById('meta'),
  year:document.getElementById('year'),
  jsonOut:document.getElementById('jsonOut'),
  coverPreview:document.getElementById('coverPreview'),
  itemList:document.getElementById('itemList'),
  epContainer:document.getElementById('epContainer')
}

// 封面预览
function previewCover(){
  dom.coverPreview.style.backgroundImage = `url(${dom.cover.value})`
}

//添加一集区块
function addEpBlock(){
  const wrap = document.createElement('div');
  wrap.className = "ep-block";
  wrap.innerHTML = `
    <input class="ep-name" placeholder="集名：第1集" style="width:100%;margin-bottom:8px;">
    <div class="lineContainer"></div>
    <button onclick="addLine(this.previousElementSibling)" style="margin-top:6px;background:#28a745;border:none;padding:4px 8px;border-radius:4px;color:#fff">+ 添加线路</button>
    <button class="del-ep" onclick="this.parentElement.remove()">删除本集</button>
  `;
  dom.epContainer.appendChild(wrap);
  //默认添加第一条线路
  addLine(wrap.querySelector('.lineContainer'));
  epBlockIndex++;
}

//添加一条线路输入框
function addLine(lineWrap){
  const div = document.createElement('div');
  div.className = "line-line";
  div.innerHTML = `
    <input placeholder="线路名称 例：线路1" class="lineName">
    <input placeholder="粘贴mp4/m3u8视频链接" class="lineSrc">
    <select class="lineType">
      <option value="m3u8">m3u8</option>
      <option value="mp4">mp4</option>
    </select>
    <button class="del-line" onclick="this.parentElement.remove()">✕</button>
  `;
  lineWrap.appendChild(div);
}

//读取所有剧集+线路
function getEpisodes(){
  const eps = [];
  document.querySelectorAll(".ep-block").forEach(epBlock=>{
    const epName = epBlock.querySelector(".ep-name").value.trim();
    if(!epName) return;
    const sources = [];
    epBlock.querySelectorAll(".line-line").forEach(lineEl=>{
      const lineName = lineEl.querySelector(".lineName").value.trim();
      const src = lineEl.querySelector(".lineSrc").value.trim();
      const type = lineEl.querySelector(".lineType").value;
      if(lineName && src){
        sources.push({lineName,src,type});
      }
    })
    if(sources.length>0){
      eps.push({name:epName, sources:sources});
    }
  })
  return eps;
}

// 渲染列表+JSON输出
function renderAll(){
  dom.itemList.innerHTML = '';
  dataList.forEach((item, idx)=>{
    const div = document.createElement('div');
    div.className = "list-item";
    div.innerHTML = `
      <div class="list-info">
        <div class="list-title">${item.title}</div>
        <div style="font-size:12px;color:#aaa">共${item.episodes.length}集 | ${item.meta}</div>
      </div>
      <div class="list-ctrl">
        <button class="ctrl-btn up" onclick="moveUp(${idx})">↑</button>
        <button class="ctrl-btn down" onclick="moveDown(${idx})">↓</button>
        <button class="ctrl-btn del" onclick="delItem(${idx})">删除</button>
      </div>
    `;
    dom.itemList.appendChild(div);
  })
  dom.jsonOut.value = JSON.stringify(dataList,null,2);
}

// 添加一条番剧
document.getElementById('addBtn').onclick = function(){
  const eps = getEpisodes();
  if(eps.length === 0){
    alert("至少添加1集，一集至少1条线路！");
    return;
  }
  const item = {
    title: dom.title.value.trim(),
    cover: dom.cover.value.trim(),
    previewThumb: dom.previewThumb.value.trim(),
    tag: dom.tag.value.trim(),
    meta: dom.meta.value.trim(),
    year: dom.year.value.trim(),
    episodes: eps
  }
  if(!item.title){
    alert('标题不能为空！');
    return;
  }
  dataList.push(item);
  renderAll();
  //清空表单
  dom.title.value = '';
  dom.cover.value = '';
  dom.previewThumb.value = '';
  dom.tag.value = '';
  dom.meta.value = '';
  dom.year.value = '';
  dom.coverPreview.style.backgroundImage = '';
  dom.epContainer.innerHTML = '';
}

//导入现有json
document.getElementById('importBtn').onclick = async function(){
  const raw = prompt("粘贴你当前 data.json 的全部内容：");
  if(!raw) return;
  try{
    const arr = JSON.parse(raw);
    if(Array.isArray(arr)){
      dataList = arr;
      renderAll();
      alert('✅ 导入成功！');
    }else{
      alert('❌ JSON格式错误，必须是数组');
    }
  }catch(e){
    alert('❌ JSON解析失败，请检查格式');
  }
}

//复制全部
document.getElementById('copyBtn').onclick = async function(){
  await navigator.clipboard.writeText(dom.jsonOut.value);
  alert('✅ JSON已经复制！粘贴到data.json');
}

//清空全部
document.getElementById('clearBtn').onclick = function(){
  if(confirm('确定清空所有数据？')){
    dataList = [];
    renderAll();
  }
}

//上移
function moveUp(index){
  if(index <= 0) return;
  [dataList[index], dataList[index-1]] = [dataList[index-1], dataList[index]];
  renderAll();
}

//下移
function moveDown(index){
  if(index >= dataList.length -1) return;
  [dataList[index], dataList[index+1]] = [dataList[index+1], dataList[index]];
  renderAll();
}

//删除单条
function delItem(index){
  if(confirm(`确定删除：${dataList[index].title}？`)){
    dataList.splice(index,1);
    renderAll();
  }
}

renderAll();
addEpBlock();
</script>
</body>
</html>
